services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: paperless-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: paperless
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    # Check whether RabbitMQ is running and responding.
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  postgres:
    image: postgres:17
    container_name: paperless-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperless-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paperless
      SPRING_DATASOURCE_USERNAME: paperless
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: paperless
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

      # Directory for uploaded PDF files
      UPLOAD_DIRECTORY: /app/uploads

      # MinIO object storage connection
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: paperless
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}

      # Elasticsearch connection
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

    ports:
      - "127.0.0.1:8080:8080"

    # Store uploaded PDF files outside the backend container.
    volumes:
      - ./uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paperless-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:80:80"

    depends_on:
      - backend

  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: Dockerfile
    container_name: paperless-ocr-worker
    restart: unless-stopped

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: paperless
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

      # Backend API connection
      BACKEND_URL: http://backend:8080

      # MinIO object storage connection
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: paperless
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}

    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
      minio:
        condition: service_started

  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    container_name: paperless-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: paperless
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

    # Consume OCR results and index them in Elasticsearch.
  indexing-worker:
    build:
      context: ./indexing-worker
      dockerfile: Dockerfile
    container_name: paperless-indexing-worker
    restart: unless-stopped

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: paperless
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      ELASTICSEARCH_URL: http://elasticsearch:9200

    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started


  # Search engine for indexed OCR text.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: paperless-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data: