spring.application.name=paperless

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/paperless
spring.datasource.username=paperless
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable database access during web response rendering
spring.jpa.open-in-view=false

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Directory for uploaded PDF files
paperless.upload.directory=${UPLOAD_DIRECTORY:uploads}

# Maximum allowed PDF upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB