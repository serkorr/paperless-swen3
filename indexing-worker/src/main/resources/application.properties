spring.application.name=indexing-worker

# Disable the web server because this worker processes messages.
spring.main.web-application-type=none

# RabbitMQ connection settings
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Elasticsearch connection settings
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}