spring.application.name=ocr-worker

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Disable the web server because this worker only processes messages
spring.main.web-application-type=none