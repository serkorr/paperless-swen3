spring.application.name=ocr-worker

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:paperless}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Disable the web server because this worker only processes messages
spring.main.web-application-type=none

# MinIO connection settings
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:paperless}
minio.secret-key=${MINIO_PASSWORD}
minio.bucket-name=paperless-documents

# Backend API for retrieving document metadata
paperless.backend.url=${BACKEND_URL:http://localhost:8080}

# Elasticsearch connection settings
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}